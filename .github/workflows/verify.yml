name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: standalone-founder-review
          path: |
            artifacts/playwright-report
            artifacts/test-results
            artifacts/evidence
            artifacts/product-preservation-report.json
            examples/standalone-acceptance.return.json
